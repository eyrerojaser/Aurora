<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="160" height="190">
  <defs>
    <linearGradient id="ala" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#F3D9F0" stop-opacity=".85"/>
      <stop offset="1" stop-color="#D9C2F2" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="vestido" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C46A9C"/>
      <stop offset=".6" stop-color="#A44F86"/>
      <stop offset="1" stop-color="#8B4789"/>
    </linearGradient>
    <linearGradient id="falda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C9DC"/>
      <stop offset="1" stop-color="#E9A6C6"/>
    </linearGradient>
    <radialGradient id="piel" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#F8D9C4"/>
      <stop offset="1" stop-color="#E9B898"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E6B5"/>
      <stop offset=".5" stop-color="#D9AE52"/>
      <stop offset="1" stop-color="#B98F36"/>
    </linearGradient>
    <radialGradient id="brillo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6D6"/>
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- alas -->
  <g class="hd-alas">
    <g class="hd-ala-izq">
      <path d="M78 92 C 40 40, 6 52, 14 82 C 20 104, 52 104, 78 96 Z" fill="url(#ala)" stroke="#E3C4E8" stroke-width="1.2"/>
      <path d="M78 100 C 46 104, 24 126, 36 140 C 48 152, 70 128, 80 104 Z" fill="url(#ala)" stroke="#E3C4E8" stroke-width="1.2"/>
      <path d="M74 94 C 52 74, 32 68, 22 78" fill="none" stroke="#fff" stroke-width="1.2" stroke-opacity=".9"/>
    </g>
    <g class="hd-ala-der">
      <path d="M82 92 C 120 40, 154 52, 146 82 C 140 104, 108 104, 82 96 Z" fill="url(#ala)" stroke="#E3C4E8" stroke-width="1.2"/>
      <path d="M82 100 C 114 104, 136 126, 124 140 C 112 152, 90 128, 80 104 Z" fill="url(#ala)" stroke="#E3C4E8" stroke-width="1.2"/>
      <path d="M86 94 C 108 74, 128 68, 138 78" fill="none" stroke="#fff" stroke-width="1.2" stroke-opacity=".9"/>
    </g>
  </g>

  <!-- piernitas -->
  <path d="M73 160 L71 176" stroke="#E9B898" stroke-width="5" stroke-linecap="round"/>
  <path d="M87 160 L90 175" stroke="#E9B898" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="70" cy="178" rx="5" ry="3" fill="#8B4789"/>
  <ellipse cx="91" cy="177" rx="5" ry="3" fill="#8B4789"/>

  <!-- falda de pétalos -->
  <path d="M58 128 C 50 150, 52 160, 62 164 C 66 156, 70 158, 72 166 C 76 158, 84 158, 88 166 C 90 158, 94 156, 98 164 C 108 160, 110 150, 102 128 Z" fill="url(#falda)" stroke="#E296BA" stroke-width="1"/>
  <!-- cuerpo del vestido -->
  <path d="M66 104 C 64 116, 60 124, 58 130 C 72 136, 88 136, 102 130 C 100 124, 96 116, 94 104 Z" fill="url(#vestido)"/>
  <path d="M60 130 C 74 135, 86 135, 100 130" fill="none" stroke="url(#oro)" stroke-width="2.2"/>

  <!-- brazo izquierdo (saluda) -->
  <g class="hd-brazo-izq">
    <path d="M68 108 C 58 114, 52 118, 48 112" stroke="#E9B898" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="47" cy="110" r="3.6" fill="#F3C9AE"/>
  </g>
  <!-- brazo derecho con varita -->
  <g class="hd-varita">
    <path d="M92 108 C 102 112, 108 108, 112 100" stroke="#E9B898" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="112" cy="99" r="3.6" fill="#F3C9AE"/>
    <line x1="112" y1="100" x2="124" y2="72" stroke="url(#oro)" stroke-width="2.6" stroke-linecap="round"/>
    <circle class="hd-luz" cx="125" cy="68" r="11" fill="url(#brillo)"/>
    <path d="M125 59 L127.6 65.4 L134.4 65.6 L129 69.8 L131 76.4 L125 72.6 L119 76.4 L121 69.8 L115.6 65.6 L122.4 65.4 Z" fill="url(#oro)" stroke="#F7E6B5" stroke-width=".8"/>
  </g>

  <!-- cuello y cabeza -->
  <rect x="76" y="96" width="8" height="10" rx="3" fill="#E9B898"/>
  <g class="hd-cabeza">
    <!-- pelo de atrás -->
    <path d="M56 70 C 52 96, 60 108, 70 104 L 90 104 C 100 108, 108 96, 104 70 Z" fill="#5B3426"/>
    <circle cx="80" cy="72" r="22" fill="url(#piel)"/>
    <!-- pelo de adelante -->
    <path d="M58 72 C 56 50, 72 44, 82 46 C 96 46, 106 56, 102 74 C 98 62, 88 56, 80 58 C 72 60, 64 64, 58 72 Z" fill="#6B3E2E"/>
    <path d="M64 58 C 70 54, 78 52, 86 54" stroke="#8A5440" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- corona de flores -->
    <g>
      <circle cx="64" cy="54" r="4.2" fill="#F6B8D1"/><circle cx="64" cy="54" r="1.6" fill="#D9AE52"/>
      <circle cx="73" cy="48" r="4.6" fill="#E98AB4"/><circle cx="73" cy="48" r="1.7" fill="#F7E6B5"/>
      <circle cx="83" cy="46" r="5" fill="#C46A9C"/><circle cx="83" cy="46" r="1.8" fill="#F7E6B5"/>
      <circle cx="93" cy="49" r="4.6" fill="#E98AB4"/><circle cx="93" cy="49" r="1.7" fill="#F7E6B5"/>
      <circle cx="100" cy="56" r="4" fill="#F6B8D1"/><circle cx="100" cy="56" r="1.5" fill="#D9AE52"/>
      <path d="M68 50 l3 -2 M88 46 l3 1 M97 52 l2 2" stroke="#8DB37A" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- cara -->
    <g class="hd-ojos">
      <ellipse cx="72.5" cy="74" rx="2.6" ry="3.2" fill="#3B2320"/>
      <ellipse cx="87.5" cy="74" rx="2.6" ry="3.2" fill="#3B2320"/>
      <circle cx="73.4" cy="72.8" r=".9" fill="#fff"/>
      <circle cx="88.4" cy="72.8" r=".9" fill="#fff"/>
    </g>
    <path d="M69 69 q3 -2 6 0 M85 69 q3 -2 6 0" stroke="#5B3426" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <ellipse cx="67" cy="81" rx="3.6" ry="2.2" fill="#F2A3B8" opacity=".6"/>
    <ellipse cx="93" cy="81" rx="3.6" ry="2.2" fill="#F2A3B8" opacity=".6"/>
    <path class="hd-boca" d="M75.5 83 q4.5 4 9 0" stroke="#B4566F" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
